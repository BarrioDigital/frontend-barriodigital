server {
    listen 80;
    server_name barriodigital.duckdns.org;

    # Redirigir HTTP a HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name barriodigital.duckdns.org;

    # Certificados SSL montados en EC2
    ssl_certificate /etc/letsencrypt/live/barriodigital.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/barriodigital.duckdns.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 1. Archivos estáticos de React
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. Proxy para Catalog Service (Red interna Docker)
    location /api/catalog {
        proxy_pass http://catalog-service:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 3. Proxy para Requests Service (Red interna Docker)
    location /api/requests {
        proxy_pass http://requests-service:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}